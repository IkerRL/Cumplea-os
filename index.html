<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎂 Tablón de Cumpleaños — Acceso</title>
  <meta name="description" content="Introduce la combinación secreta para entrar al tablón de cumpleaños." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="enviar.css" />
</head>
<body>

  <!-- Partículas de fondo -->
  <div class="bg-particles" id="bgParticles"></div>

  <!-- ===== MODAL DE UNLOCK (se muestra nada más entrar) ===== -->
  <div class="unlock-overlay" id="unlockOverlay">
    <div class="unlock-modal" id="unlockModal">

      <!-- Pastel grande -->
      <div class="unlock-cake-big">🎂</div>

      <!-- Título -->
      <h1 class="unlock-title">Acceso secreto al muro</h1>

      <!-- 4 ranuras en fila -->
      <div class="unlock-slots">
        <div class="slot-wrap">
          <input type="number" class="unlock-digit" id="ud1" min="0" max="9" placeholder="·" inputmode="numeric" />
        </div>
        <div class="slot-wrap">
          <input type="number" class="unlock-digit" id="ud2" min="0" max="9" placeholder="·" inputmode="numeric" />
        </div>
        <div class="slot-wrap">
          <input type="number" class="unlock-digit" id="ud3" min="0" max="9" placeholder="·" inputmode="numeric" />
        </div>
        <!-- Ranura agente -->
        <div class="slot-wrap">
          <button class="unlock-agent-slot" id="agentSlot" aria-label="Seleccionar agente">
            <span class="agent-slot-placeholder" id="agentSlotPlaceholder">?</span>
            <img class="agent-slot-img" id="agentSlotImg" src="" alt="" hidden />
          </button>
        </div>
      </div>

      <!-- Picker de agentes (oculto hasta que se pulse la ranura) -->
      <div class="agent-picker" id="agentPicker" hidden>
        <p class="picker-label">Elige tu agente</p>
        <div class="agent-picker-grid" id="agentPickerGrid">
          <!-- Imágenes generadas por JS -->
        </div>
      </div>

      <!-- Botón entrar -->
      <button class="unlock-btn" id="unlockBtn">Entrar al tablón ✨</button>

      <!-- Error -->
      <p class="unlock-error" id="unlockError" hidden>❌ Combinación incorrecta</p>

    </div>
  </div>

  <!-- Scripts -->
  <script src="unlock-modal.js"></script>
</body>
</html>
